<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="118 87 1772 1772" width="600" height="600" role="img" aria-label="SecureXone SX animated logo" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>SecureXone - SX Logo</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="6%" r="95%">
      <stop offset="0" stop-color="#5a14d0"/>
      <stop offset="0.28" stop-color="#2a0a78"/>
      <stop offset="0.6" stop-color="#0d0230"/>
      <stop offset="1" stop-color="#05001a"/>
    </radialGradient>
    <linearGradient id="sGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#f6f3ff"/>
      <stop offset="1" stop-color="#cfc2ff"/>
    </linearGradient>
    <linearGradient id="xA" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d12cff"/>
      <stop offset="0.35" stop-color="#7a1cff"/>
      <stop offset="1" stop-color="#c81cff"/>
    </linearGradient>
    <linearGradient id="xB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7b22ff"/>
      <stop offset="0.5" stop-color="#b21cff"/>
      <stop offset="1" stop-color="#6a1dff"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b54bff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#b54bff"/>
      <stop offset="1" stop-color="#6a1dff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="floorGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#c13bff" stop-opacity="0.9"/>
      <stop offset="0.4" stop-color="#7a1cff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7a1cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#8a2dff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#8a2dff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>

    <path id="S" d="M703 690 L1120 690 L1200 770 L1198 798 L730 798 L660 865 L975 865 L1088 985 L925 1170 L460 1170 L640 1042 L885 1042 L935 1000 L915 975 L570 975 L508 912 L555 830 Z"/>
    <path id="XA" d="M1345 688 L1555 685 L1275 938 L1180 1030 L868 1280 L1095 1000 L1190 830 Z"/>
    <path id="XB" d="M995 825 L1085 825 L1485 1172 L1305 1172 Z"/>

    <clipPath id="logoClip">
      <use href="#S"/><use href="#XA"/><use href="#XB"/>
    </clipPath>
    <clipPath id="circleClip"><circle cx="1003" cy="972" r="885"/></clipPath>
  </defs>

  <style>
    .fadeIn   { opacity:0; animation: fadeIn 1s ease-out .1s forwards; }
    .sIn      { opacity:0; animation: sIn 1.1s cubic-bezier(.2,.9,.25,1) .5s forwards; }
    .xaIn     { opacity:0; animation: xaIn 1.1s cubic-bezier(.2,.9,.25,1) .8s forwards; }
    .xbIn     { opacity:0; animation: xbIn 1.1s cubic-bezier(.2,.9,.25,1) 1s forwards; }
    .float    { animation: float 5s ease-in-out 2.2s infinite; }
    .ringSpin { transform-origin:1003px 972px; animation: spin 24s linear infinite; }
    .ringSpin2{ transform-origin:1003px 972px; animation: spin 36s linear infinite reverse; }
    .breath   { transform-origin:1003px 972px; animation: breath 4.5s ease-in-out infinite; }
    .sweep    { animation: sweep 5s ease-in-out 2.4s infinite; }
    .floor    { transform-origin:1003px 1290px; opacity:0; animation: floorIn 1s ease-out 1.5s forwards, floorPulse 3.2s ease-in-out 2.5s infinite; }
    .spark    { opacity:0; animation: rise 6s linear infinite; }
    .d1{animation-delay:1.8s}.d2{animation-delay:2.6s}.d3{animation-delay:3.4s}
    .d4{animation-delay:4.2s}.d5{animation-delay:5s}.d6{animation-delay:5.8s}

    @keyframes fadeIn { to { opacity:1 } }
    @keyframes sIn  { from{opacity:0; transform:translateX(-260px)} to{opacity:1; transform:translateX(0)} }
    @keyframes xaIn { from{opacity:0; transform:translate(260px,-120px)} to{opacity:1; transform:translate(0,0)} }
    @keyframes xbIn { from{opacity:0; transform:translate(200px,160px)} to{opacity:1; transform:translate(0,0)} }
    @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-14px)} }
    @keyframes spin { to { transform:rotate(360deg) } }
    @keyframes breath { 0%,100%{opacity:.55; transform:scale(1)} 50%{opacity:1; transform:scale(1.08)} }
    @keyframes sweep { 0%{transform:translateX(-900px)} 45%,100%{transform:translateX(900px)} }
    @keyframes floorIn { to{opacity:1} }
    @keyframes floorPulse { 0%,100%{transform:scaleX(1); filter:brightness(1)} 50%{transform:scaleX(1.25); filter:brightness(1.5)} }
    @keyframes rise { 0%{opacity:0; transform:translateY(0)} 15%{opacity:.9} 100%{opacity:0; transform:translateY(-320px)} }
  </style>

  <g clip-path="url(#circleClip)">
    <!-- Background -->
    <circle cx="1003" cy="972" r="885" fill="url(#bg)"/>
    <circle class="breath" cx="1003" cy="972" r="560" fill="url(#halo)"/>

    <!-- Orbit rings -->
    <g class="fadeIn">
      <circle class="ringSpin" cx="1003" cy="972" r="840" fill="none" stroke="url(#ring)" stroke-width="5" stroke-linecap="round" stroke-dasharray="520 260 120 380"/>
      <circle class="ringSpin2" cx="1003" cy="972" r="770" fill="none" stroke="#9b3dff" stroke-opacity=".35" stroke-width="2" stroke-dasharray="6 22"/>
    </g>

    <!-- Floating sparks -->
    <g fill="#d9a8ff">
      <circle class="spark d1" cx="760"  cy="1300" r="5"/>
      <circle class="spark d2" cx="930"  cy="1330" r="4"/>
      <circle class="spark d3" cx="1110" cy="1310" r="6"/>
      <circle class="spark d4" cx="1260" cy="1340" r="4"/>
      <circle class="spark d5" cx="1400" cy="1300" r="5"/>
      <circle class="spark d6" cx="640"  cy="1320" r="3.5"/>
    </g>

    <!-- Logo -->
    <g class="float">
      <!-- soft glow behind -->
      <g filter="url(#soft)" opacity=".55" class="fadeIn">
        <use href="#XA" fill="#a21cff"/><use href="#XB" fill="#7a1cff"/>
      </g>

      <g class="sIn"><use href="#S" fill="url(#sGrad)" filter="url(#glow)"/></g>
      <g class="xaIn"><use href="#XA" fill="url(#xA)" filter="url(#glow)"/></g>
      <g class="xbIn"><use href="#XB" fill="url(#xB)" filter="url(#glow)"/></g>

      <!-- Shine sweep -->
      <g clip-path="url(#logoClip)">
        <g class="sweep">
          <rect x="300" y="600" width="170" height="750" fill="url(#shine)" transform="skewX(-22)" opacity=".7"/>
        </g>
      </g>
    </g>

    <!-- Floor light -->
    <g class="floor">
      <ellipse cx="1003" cy="1292" rx="520" ry="40" fill="url(#floorGlow)"/>
      <rect x="620" y="1288" width="760" height="5" rx="2.5" fill="url(#floorGlow)"/>
    </g>
  </g>

  <!-- Rim -->
  <circle cx="1003" cy="972" r="885" fill="none" stroke="#8a2dff" stroke-opacity=".35" stroke-width="3"/>
</svg>
